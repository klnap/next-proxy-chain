name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'const title = process.env.PR_TITLE; const valid = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+$/u.test(title); if (!valid) { console.error("Invalid Conventional Commit title: " + title); process.exit(1); }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun run check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use the pinned npm CLI
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(./node_modules/.bin/npm --version)" = "12.2.3"

      - name: Create and inspect the package tarball
        id: pack
        env:
          TARBALL_DIR: ${{ runner.temp }}
        run: |
          npm pack --pack-destination "$TARBALL_DIR" --json > "$TARBALL_DIR/pack.json"
          TARBALL="$(node -e 'const path = require("node:path"); const output = require(process.argv[1]); const pack = Array.isArray(output) ? output[0] : Object.values(output)[0]; process.stdout.write(path.join(process.env.TARBALL_DIR, pack.filename));' "$TARBALL_DIR/pack.json")"
          echo "path=$TARBALL" >> "$GITHUB_OUTPUT"
          node --input-type=module - "$TARBALL" <<'NODE'
          import { execFileSync } from "node:child_process";
          const tarball = process.argv[2];
          const files = execFileSync("tar", ["-tzf", tarball], { encoding: "utf8" }).trim().split("\n");
          const allowed = new Set(["package/package.json", "package/README.md", "package/CHANGELOG.md", "package/LICENSE", "package/dist/index.cjs", "package/dist/index.d.cts", "package/dist/index.d.ts", "package/dist/index.js"]);
          if (files.some((file) => !allowed.has(file))) throw new Error(`Unexpected tarball file: ${files.find((file) => !allowed.has(file))}`);
          for (const file of ["package/dist/index.cjs", "package/dist/index.d.cts", "package/dist/index.d.ts", "package/dist/index.js"]) {
            if (!files.includes(file)) throw new Error(`Missing tarball file: ${file}`);
          }
          const manifest = JSON.parse(execFileSync("tar", ["-xOf", tarball, "package/package.json"], { encoding: "utf8" }));
          const entry = manifest.exports?.["."];
          if (Object.keys(manifest.exports ?? {}).join() !== "." || entry?.import?.types !== "./dist/index.d.ts" || entry?.import?.default !== "./dist/index.js" || entry?.require?.types !== "./dist/index.d.cts" || entry?.require?.default !== "./dist/index.cjs") throw new Error("Unexpected public exports.");
          console.log(files.join("\n"));
          NODE

      - name: Install tarball in an isolated consumer
        env:
          TARBALL: ${{ steps.pack.outputs.path }}
          CONSUMER_DIR: ${{ runner.temp }}/consumer
        run: | # zizmor: ignore[adhoc-packages] install the exact local tarball and pinned peer dependencies; lifecycle scripts are disabled
          mkdir -p "$CONSUMER_DIR"
          npm install --prefix "$CONSUMER_DIR" --ignore-scripts --no-audit --no-fund "$TARBALL" next@15.5.29 react@18.2.0 react-dom@18.2.0 @types/node@20
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          PACKAGE_NAME="$PACKAGE_NAME" CONSUMER_DIR="$CONSUMER_DIR" node <<'NODE'
          const fs = require("node:fs");
          const name = JSON.stringify(process.env.PACKAGE_NAME);
          const dir = process.env.CONSUMER_DIR;
          fs.writeFileSync(`${dir}/consumer.mts`, `import * as api from ${name};\nimport type { ChainEntry, ChainLogger, ChainScope, DefinedProxy, Entry, HostMatcher, MergeStrategy, NativeProxy, NextOptions, NextResult, OnErrorHandler, OnErrorResult, PathMatcher, ProxyChainOptions, ProxyContext, ProxyFn, ProxyPathFilter, ProxyRule, RequestHeaderPolicy } from ${name};\nconst result = api.next();\nif (!api.isNextResult(result)) throw new Error("next() must return a continuation result");\nconst proxy = api.chain([]);\nvoid proxy;\ntype PublicTypes = [ChainEntry, ChainLogger, ChainScope, DefinedProxy, Entry, HostMatcher, MergeStrategy, NativeProxy, NextOptions, NextResult, OnErrorHandler, OnErrorResult, PathMatcher, ProxyChainOptions, ProxyContext, ProxyFn, ProxyPathFilter, ProxyRule, RequestHeaderPolicy];\nvoid (0 as unknown as PublicTypes);\n`);
          fs.writeFileSync(`${dir}/consumer.cts`, `import api = require(${name});\nimport type { ChainEntry, ChainLogger, ChainScope, DefinedProxy, Entry, HostMatcher, MergeStrategy, NativeProxy, NextOptions, NextResult, OnErrorHandler, OnErrorResult, PathMatcher, ProxyChainOptions, ProxyContext, ProxyFn, ProxyPathFilter, ProxyRule, RequestHeaderPolicy } from ${name};\nconst result = api.next();\nif (!api.isNextResult(result)) throw new Error("next() must return a continuation result");\ntype PublicTypes = [ChainEntry, ChainLogger, ChainScope, DefinedProxy, Entry, HostMatcher, MergeStrategy, NativeProxy, NextOptions, NextResult, OnErrorHandler, OnErrorResult, PathMatcher, ProxyChainOptions, ProxyContext, ProxyFn, ProxyPathFilter, ProxyRule, RequestHeaderPolicy];\nvoid (0 as unknown as PublicTypes);\n`);
          fs.writeFileSync(`${dir}/consumer.mjs`, `import assert from "node:assert/strict";\nimport * as api from ${name};\nassert.deepEqual(Object.keys(api).sort(), ["RuleTimeoutError", "chain", "createProxyContext", "defineProxy", "host", "isNextResult", "next", "path", "proxyChain"]);\nassert.equal(api.isNextResult(api.next()), true);\n`);
          fs.writeFileSync(`${dir}/consumer.cjs`, `const assert = require("node:assert/strict");\nconst api = require(${name});\nassert.deepEqual(Object.keys(api).sort(), ["RuleTimeoutError", "chain", "createProxyContext", "defineProxy", "host", "isNextResult", "next", "path", "proxyChain"]);\nassert.equal(api.isNextResult(api.next()), true);\n`);
          fs.writeFileSync(`${dir}/tsconfig.json`, JSON.stringify({ compilerOptions: { target: "ES2022", module: "NodeNext", moduleResolution: "NodeNext", strict: true, noEmit: true, skipLibCheck: true, types: [] }, include: ["consumer.mts", "consumer.cts"] }));
          NODE
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --project "$CONSUMER_DIR/tsconfig.json"
          cd "$CONSUMER_DIR"
          bun consumer.mjs
          node consumer.cjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.0.0
          package-manager-cache: false

      - name: Test the tarball on minimum supported Node.js
        working-directory: ${{ runner.temp }}/consumer
        run: node consumer.cjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Test the tarball on Node.js 22
        working-directory: ${{ runner.temp }}/consumer
        run: node consumer.cjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test the tarball on Node.js 24
        working-directory: ${{ runner.temp }}/consumer
        run: node consumer.cjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Test the tarball on Node.js 26
        working-directory: ${{ runner.temp }}/consumer
        run: node consumer.cjs
